<style>
/* ===== 参考截图实测栅格 ===== */
/* 正文色用 --tx；不要复用 --ink，主样式里它是全站 ::selection 的底色 */
:root{
  --pad-x:48px;            /* 导航/页脚左右内缩 = 3.3vw */
  --col-x:11.2vw;          /* 左信息栏起点 */
  --col-w:15vw;            /* 左信息栏宽 */
  --text:11.43px; --val:14.35px; --vls:-.29px; --label:9.28px; --w:600; --ls:-.23px;
  --bg:#ffffff;   /* 页面底色按你要求改成纯白（原来是参考站的 #f8f8f8） */ --tx:#070304; --dim:#8a8a8a; --dim2:#b2b2b2; --blue:#00288d;
  --acc:#ff4401; --line:rgba(133,133,133,.15);
  --pic-l:42.5vw; --pic-r:4.5vw; --pic-t:calc(25.5svh - var(--injected-top,0px)); --pic-b:10svh;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--dim);font-family:"Geist Pixel","Noto Sans SC","Helvetica Neue",Helvetica,sans-serif;font-weight:var(--w);font-size:var(--text);letter-spacing:var(--ls)}
a{color:inherit;text-decoration:none}

/* 顶部导航：高 12.2vh，链接整组偏屏幕中线左侧 */
/* 只改一件事：脱离文档流，以免把已定稿的首屏栅格往下推；内缩/上边距沿用存档页同值 */
.jh-page.ar-page{min-height:0;padding-bottom:0;font-family:var(--jhfont);font-size:16px;font-weight:300;letter-spacing:normal}   /* 别继承本页 body 的 11.43px/600/-.23px */
.jh-page.ar-page>.jh-nav{position:fixed;top:var(--injected-top,0px);left:clamp(20px,2.22vw,40px);right:clamp(20px,2.22vw,40px);z-index:70;padding:clamp(14px,2.2svh,26px) 0 0}

/* 第一屏 */
.s1{position:relative;min-height:calc(100svh - var(--injected-top,0px));display:grid;grid-template-columns:1fr}
/* 左列（四组信息 + 左下 0% 进度）：CSS sticky 钉住，任何滚动速度都零延迟不动 */
.leftcol{grid-area:1/1;position:sticky;top:var(--injected-top,0px);align-self:start;height:calc(100svh - var(--injected-top,0px));z-index:2;pointer-events:none}
/* 左侧信息组：四组，基线在 54% / 61% / 70% / 77% */
.info{pointer-events:none;position:absolute;left:var(--col-x);top:calc(0px - var(--injected-top,0px));height:100%;width:var(--col-w);display:block}
.info a,.info button,.info dl{pointer-events:auto;width:fit-content}
.info dl{margin:0;display:block}
.info dl+dl{margin-top:42px}
.info dl:first-child{margin-top:54svh}

.info dt{font-size:var(--label);font-weight:700;color:var(--dim2);margin:0 0 15px}
.info dd{margin:0;color:var(--dim);font-size:var(--val);font-weight:var(--w);line-height:1.3;letter-spacing:var(--vls)}
.info dd.big{color:var(--dim)}

.info .dim{color:var(--dim)}
/* 主图 + 下一张只露一条：42.5%→95.5% 宽、25.5%→90% 高（≈1.59） */
/* 右侧图片 = 存档页 .ar-grid/.ar-cell 那套（格 155×225.4、列距 84.4、行距 0、编号 ( NN )）
   只把 6 列改成 3 列；整块右靠，距屏幕右边缘 40px，左边空出来留给以后要放的东西 */
/* 与存档页一模一样：版心 = min(1416px, 100vw - 88px) 居中，标题与网格都贴版心最左；
   列间距 = 原站算式 (版心 - 6×155) / 5（1440 下 84.4px、2556 下 97.2px）；标题顶 = 原站的 148px */
.pics{grid-area:1/1;position:relative;z-index:1;justify-self:end;width:calc(100vw - 342px);margin:0 calc(386px - (min(1416px,100vw - 88px) - 930px)/5) 0 0;padding-bottom:calc(var(--prog-bottom,78px) - 51px)}
.pics-inner{margin-left:auto;width:fit-content}
   /* 顶部留白由 JS 算，保证标题恒落在原站的 152px */
.ar-grid.case3{display:grid;grid-template-columns:repeat(4,155px);justify-content:start;--cgap:calc((min(1416px,calc(100vw - 88px)) - 930px)/5);column-gap:var(--cgap);row-gap:0;margin-top:24px}
.ar-grid.case3 .ar-cell:nth-child(4n){transform:translateX(calc(100px - var(--cgap)))}
.ar-grid.case3 .ar-cell:not(:has(img)){pointer-events:none}
.ar-grid.case3{padding-bottom:0}
.ar-grid.case3.case4 .ar-cell{transform:none!important}   /* 4列模式：取消第4列右移，四列均匀 */
.ar-grid.case3 .ar-img{left:0;top:8.607%;width:100%;aspect-ratio:1/1;height:auto;object-fit:cover}
.ar-grid.case3 .ar-no{font-family:"Geist Pixel","Noto Sans SC",var(--jhfont),sans-serif;font-weight:400;font-size:12px;line-height:1.2;color:#141414}

/* 图内左上：三行细体小字 + 右上编号 */
/* 左下浏览进度 */
.prog{pointer-events:auto;position:absolute;left:var(--col-x);bottom:var(--prog-bottom,78px);width:383px;height:2px}   /* 轨道长度按你要求 153px → 383px */
.prog u{display:block;width:100%;height:2px;background:rgba(0,0,0,.14);text-decoration:none;position:relative}
.prog u i{position:absolute;left:0;top:0;height:2px;width:0;background:var(--blue)}
.prog b{position:absolute;left:0;bottom:22px;transform:translateX(-50%);white-space:nowrap;font-weight:var(--w);font-size:12.2px;letter-spacing:var(--vls);color:var(--blue)}
/* 页面右下编号 */
.corner{pointer-events:none;position:absolute;right:1.6vw;bottom:2.4svh;font-size:var(--label);color:var(--dim2)}


/* 底部项目切换条：复用站点 .ar-dock / .ar-back，字号字重字距与 product.html 那条一致 */
/* 底行：黑色版那一条的原始数值，逐条照搬（只把黑底换成白底） */
/* 定位/白底放外层 .projbar：flex 盒子自身吃 position:fixed + bottom:0 时 Chromium 算出的行高偏小，落点会错位 */
.projbar{position:fixed;z-index:3;left:0;right:0;bottom:0;height:49px;background:#fff}   /* 1px 上分隔线按你要求去掉，底栏与白底页面融为一体 */
/* 字号字重字距行高颜色与整条高度 = a3d 底栏 a.ar-back / .ar-dock 实测值（内缩 16px 12px 25px 同原条） */
.projnav{display:flex;justify-content:space-between;align-items:flex-start;gap:26px;flex-wrap:wrap;box-sizing:border-box;height:56px;
  font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;letter-spacing:3.9px;line-height:13px;
  color:#3b3b3b;padding:18px 40px 25px}   /* 行顶 18px + 行高 13px → 文字离屏幕底边 25px；左右 40px = 文字离屏幕左右边缘 */
.projnav a{color:#3b3b3b;text-decoration:none}
.projnav a:hover{text-decoration:underline;text-underline-offset:3px}

@media (max-width:860px){
  :root{--col-x:24px;--col-w:calc(100vw - 48px);--pad-x:24px;--pic-l:24px;--pic-r:24px;--pic-t:34svh}
  .info{position:static;width:auto;display:grid;grid-template-rows:none;gap:22px;padding:calc(12.2vh + 24px) 0 0}
  .info::before{display:none}
  .leftcol{position:static;height:auto;pointer-events:auto}
  .pics{justify-self:stretch;margin:8svh 24px 0 !important}
.pics-inner{width:auto;margin-left:0}
  .ar-title{font-size:23px}
  .ar-grid.case3{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px}
  .s1{min-height:0;padding-bottom:8svh}
  .prog,.corner{position:static;margin:6svh 24px 0}
  .prog{position:relative;left:auto;bottom:auto;width:calc(100vw - 48px)}   /* 手机端轨道 = 屏宽减左右 24px；数字改 top 定位才不会甩到轨道外 */
  .prog b{bottom:auto;top:-24px}
  .projnav{gap:14px;height:auto;padding:18px 40px 25px;letter-spacing:2px}
}

/* 深色图上的小字（图内标签、角标）：反色块换成浅色，保证压在墨底图上也看得清 */
.pics ::selection{background:#f2f2f0;color:#070304}
/* [改] 主图案例 42 张图：155×155 正方形（覆盖共享 CSS 的 155/225.4 竖版，仅本页生效） */
/* [改] 仅图片尺寸：1:1（155×155），格子/间距/编号/排版全部保持原样 */
/* [改] Kang Huihui 左移 4px（仅视觉位移） */
.jh-navname{transform:translateX(-4px)}
/* [改] 左上角 K 字标（含方框）左移 8px（仅视觉位移） */
.jh-nav .logo{transform:translateX(-8px)}
</style>

/* 底部切换栏：贴住视口最底（top 由 JS 定，flex+fixed 同盒子时 Chromium 会算错行高）；
   左下进度件落在它上方 22px */
const setBars = () => {
  const bar = document.querySelector('.projbar'), nav = document.querySelector('.projnav');
  if (!bar || !nav) return;
  const ft = document.getElementById('mulepage-footer');
  const nb = 0;                                             /* 要求顶住屏幕最底：不给平台注入的底部条让位 */
  const h = nav.offsetHeight;
  bar.style.top = Math.round(innerHeight - 49) + 'px';
  document.documentElement.style.setProperty('--prog-bottom', (nb + h + 22) + 'px');
  /* 底栏左右文字对齐：左对齐左侧项目文字；右侧恒距视口右缘 286px，
     并用 transform 把整块网格平移到详情列右缘正好落在 286px 处（无视窗口宽度和滚动条） */
  const dl = document.querySelector('.leftcol dl'), g = document.querySelector('.ar-grid.case3');
  if (dl) nav.style.paddingLeft = Math.max(0, Math.round(dl.getBoundingClientRect().left)) + 'px';
  if (g) {
    const inner = g.parentElement, det = g.querySelector('img[alt="详情页"]');
    const cw = document.documentElement.clientWidth;
    /* 窗口太窄放不下时整体等比缩小，保证 4 列 + 286px 右边距始终可见 */
    const cg = parseFloat(getComputedStyle(g).columnGap) || 0;
    const need = 620 + 3 * cg + (100 - cg) + 286 + 12;
    const z = need > cw ? cw / need : 1;
    inner.style.zoom = z < 1 ? z : '';
    if (det) {
      const target = cw - 286;
      const cur = det.getBoundingClientRect().right;
      const base = parseFloat(inner.dataset.ax || '0');
      const nx = base + (target - cur) / (z || 1);   /* zoom 下 transform 是局部坐标，除回缩放比 */
      inner.dataset.ax = nx;
      inner.style.transform = 'translateX(' + nx + 'px)';
    }
    if (det) { nav.style.paddingRight = '286px'; }
    else {
      /* 4列模式：「下一个项目」右缘与第 4 列图片右缘对齐（左侧项目文字与中间全部链接位置不动） */
      let c4 = null;
      g.querySelectorAll('img').forEach(im => { const r = im.getBoundingClientRect(); if (!c4 || r.right > c4.right) c4 = { right: r.right }; });
      if (c4) {
        const nx = document.getElementById('next');
        nx.style.position = 'absolute';
        nx.style.left = 'auto';
        nx.style.right = Math.max(0, innerWidth - Math.round(c4.right)) + 'px';
      }
    }
  }
};

/* 浏览进度：滚动 0→100% 驱动左下角百分比与细线 */
addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  $('pct').textContent = Math.round(p * 100) + '%';
  const TR = $('pbar').parentElement.getBoundingClientRect().width || 383, passed = p * TR;   /* 轨道实际宽度，窄屏自适应 */
  $('pbar').style.width = passed.toFixed(1) + 'px';
  const halfW = ($('pct').getBoundingClientRect().width || 26) / 2;   /* 数字跟着进度头走，两端不出轨 */
  $('pct').style.left = Math.max(halfW, Math.min(TR - halfW, passed)).toFixed(1) + 'px';
  const idx = Math.min(S.length, Math.max(1, Math.round(p * S.length)));
  $('corner').textContent = String(idx).padStart(2, '0');

/* 眼睛跟视线：算法从存档页 bundle 原样搬来（1.6s 无移动则回看默认锚点、半径 3px、55px 归一、每帧 0.18 插值） */
(function eyesFollow(){
  const host = document.querySelector('.jh-nav .eyes'); if (!host) return;
  const pupils = Array.from(host.querySelectorAll('.pupil'));
  const IDLE = 1600, R = 3, NORM = 55;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    pupils.forEach(el => { el.style.transform = 'translate(-3px, 3px)'; }); return;
  }
  const pt = {x: innerWidth/2, y: 0, at: 0};
  addEventListener('pointermove', (e) => { pt.x = e.clientX; pt.y = e.clientY; pt.at = performance.now(); }, {passive:true});
  const cur = pupils.map(() => ({x:0, y:0}));
  const step = (now) => {
    let ax = innerWidth/2, ay = innerHeight * 0.42;
    const hero = document.getElementById('hero-figure');
    if (hero) { const r = hero.getBoundingClientRect(); ax = r.left + r.width/2; ay = r.top + r.height * 0.16; }
    if (now - pt.at <= IDLE) { ax = pt.x; ay = pt.y; }
    pupils.forEach((el, i) => {
      const b = el.getBoundingClientRect(), cx = b.left + b.width/2, cy = b.top + b.height/2;
      const k = Math.min(1, Math.hypot(ax - cx, ay - cy) / NORM), a = Math.atan2(ay - cy, ax - cx);
      cur[i].x += (Math.cos(a) * R * k - cur[i].x) * 0.18;
      cur[i].y += (Math.sin(a) * R * k - cur[i].y) * 0.18;
      el.style.transform = 'translate(' + cur[i].x.toFixed(2) + 'px, ' + cur[i].y.toFixed(2) + 'px)';
    });
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
})();

<style>

<script>
(function(){
  const EASE = 'cubic-bezier(.22,1,.36,1)';
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pad = n => String(n).padStart(2,'0');
  const imgs = Array.from(document.querySelectorAll('.ar-grid .ar-img'));
  if (!imgs.length) return;
  let list = [], cur = 0, ov = null, zbox, zcan, zbg, zimg, T, drag, raf = 0, opening = false, closing = false, switching = false, srcRect = null;

  function stageRect(){
    const nat = zimg.naturalWidth && zimg.naturalHeight ? {w:zimg.naturalWidth, h:zimg.naturalHeight} : {w:1100, h:1100};
    if (nat.h / nat.w > 1.2) {
      /* 长图（详情页）模式：与 archive.html 详情页案例一致，高 95vh、宽按比例 */
      const h = innerHeight * .95, w = h * nat.w / nat.h;
      return {w:w, h:h, left:(innerWidth - w)/2, top:(innerHeight - h)/2};
    }
    const side = Math.min(innerWidth * .82, innerHeight * .72);
    const w = side * nat.w / nat.h, h = side * nat.h / nat.w;
    return {w:w, h:h, left:(innerWidth - w)/2, top:(innerHeight - h)/2};
  }
  function clampPan(){
    const r = stageRect(), sw = r.w * T.z, sh = r.h * T.z;
    T.ox = sw <= innerWidth ? (innerWidth - sw)/2 - r.left : Math.min(-r.left, Math.max(innerWidth - r.left - sw, T.ox));
    T.oy = sh <= innerHeight ? (innerHeight - sh)/2 - r.top : Math.min(-r.top, Math.max(innerHeight - r.top - sh, T.oy));
  }
  function apply(){
    if (!zcan) return;
    zcan.style.transform = 'translate(' + T.ox + 'px,' + T.oy + 'px) scale(' + T.z + ')';
    zbox.classList.toggle('atmax', T.z >= T.max - .001);
  }
  function zoomAt(x, y, f){
    const r = stageRect();
    const nz = Math.max(1, Math.min(T.max, T.z * f));
    const ex = x - (r.left + T.ox), ey = y - (r.top + T.oy), k = nz / T.z;
    T.ox += ex * (1 - k); T.oy += ey * (1 - k); T.z = nz;
    clampPan(); apply();
  }
  function inertia(){
    drag.vx *= .94; drag.vy *= .94;
    T.ox += drag.vx * 16; T.oy += drag.vy * 16;
    clampPan(); apply();
    if (Math.hypot(drag.vx, drag.vy) > .015) raf = requestAnimationFrame(inertia);
  }
  function goto(d){
    if (!zcan || switching || closing) return;
    const n = (cur + (d > 0 ? 1 : -1) + list.length) % list.length;
    if (RM){ cur = n; zimg.src = list[cur].src; reset(); return; }
    switching = true;
    const a = zcan.animate([{transform:zcan.style.transform, opacity:1},{transform:zcan.style.transform + ' translateX(' + (-34 * Math.sign(d)) + 'px)', opacity:0}], {duration:150, easing:'ease-in', fill:'forwards'});
    a.finished.then(() => {
      cur = n; zimg.src = list[cur].src; reset(); window.__zcnt && window.__zcnt();
      requestAnimationFrame(() => {
        a.cancel();
        const t0 = zcan.style.transform;
        zcan.animate([{transform:'translateX(' + (34 * Math.sign(d)) + 'px) ' + t0, opacity:0},{transform:t0, opacity:1}], {duration:260, easing:EASE}).finished.then(() => { switching = false; }, () => { switching = false; });
      });
    }, () => { switching = false; });
    [1,-1].forEach(k => { const im = new Image(); im.src = list[(cur + k + list.length) % list.length].src; });
  }
  function reset(){ T = {z:1, max:50, ox:0, oy:0}; const r = stageRect(); T.max = Math.max(1.5, Math.min(50, 60000 / r.h)); clampPan(); apply(); }

  function close(){
    if (closing || !ov) return; closing = true;
    if (RM){ finish(); return; }
    const r = srcRect && srcRect.bottom > 0 && srcRect.top < innerHeight && srcRect.right > 0 && srcRect.left < innerWidth;
    const t = r ? 'translate(' + srcRect.left + 'px,' + srcRect.top + 'px) scale(' + (srcRect.width / stageRect().w) + ',' + (srcRect.height / stageRect().h) + ')' : 'scale(0.92)';
    const a = zbox.animate([{transform:'none'},{transform:t, ...(r ? {} : {opacity:0})}], {duration:520, easing:'cubic-bezier(.55,.06,.68,.19)', fill:'forwards'});
    zbg.animate([{opacity:1},{opacity:0}], {duration:390, easing:'ease-in'}).finished.then(finish, finish);
    a.finished.catch(()=>{});
    function finish(){ document.removeEventListener('keydown', onKey); removeEventListener('wheel', wheelBlock, true); document.removeEventListener('wheel', wheelBlock, true); ov.remove(); ov = null; }
  }
  function wheelBlock(e){
    if (!ov) return;
    const b = zbox.getBoundingClientRect();
    const onImg = e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom;
    if (onImg){ e.preventDefault(); e.stopPropagation(); if (!opening) zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.25 : 1/1.25); }
    /* 在图外：不拦截，下层网页正常滚动 */
  }
  function onKey(e){
    if (e.key === 'Escape'){ close(); return; }
    if (e.key === 'ArrowLeft'){ goto(-1); return; }
    if (e.key === 'ArrowRight'){ goto(1); }
  }

  function open(i, thumb){
    if (ov) return; closing = false; opening = true;
    srcRect = thumb.getBoundingClientRect();
    cur = i; list = imgs;
    ov = document.createElement('div'); ov.className = 'ar-zoom'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
    zbg = document.createElement('div'); zbg.className = 'ar-zbg';
    zbox = document.createElement('div'); zbox.className = 'ar-zbox z-stage';
    zcan = document.createElement('div'); zcan.className = 'z-canvas';
    zimg = document.createElement('img'); zimg.className = 'ar-zimg'; zimg.draggable = false; zimg.alt = '主图案例 ' + pad(i+1); zimg.src = imgs[i].currentSrc || imgs[i].src;
    const zx = document.createElement('button'); zx.type = 'button'; zx.className = 'ar-zx'; zx.setAttribute('aria-label','关闭'); zx.textContent = '×'; zx.addEventListener('click', e => { e.stopPropagation(); close(); });
    zcan.appendChild(zimg); zbox.appendChild(zcan); zbox.appendChild(zx);
    const nl = document.createElement('button'); nl.type = 'button'; nl.className = 'ar-znav l'; nl.setAttribute('aria-label','上一张');
    nl.innerHTML = '<svg class="ar-znav-ico" width="44" height="12" viewBox="0 0 44 12" aria-hidden="true"><path d="M0.5 6 H43.5 M7.5 1 L1 6 L7.5 11" fill="none" stroke="currentColor" stroke-width="1"/></svg><span class="ar-zcnt"></span>';
    const nr = document.createElement('button'); nr.type = 'button'; nr.className = 'ar-znav r'; nr.setAttribute('aria-label','下一张');
    nr.innerHTML = '<span class="ar-zcnt"></span><svg class="ar-znav-ico" width="44" height="12" viewBox="0 0 44 12" aria-hidden="true"><path d="M0.5 6 H43.5 M36.5 1 L43 6 L36.5 11" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
    nl.addEventListener('click', e => { e.stopPropagation(); goto(-1); });
    nr.addEventListener('click', e => { e.stopPropagation(); goto(1); });
    ov.appendChild(zbg); ov.appendChild(nl); ov.appendChild(nr); ov.appendChild(zbox);
    document.body.appendChild(ov);
    

    const place = () => {
      const r = stageRect();
      zbox.style.left = r.left + 'px'; zbox.style.top = r.top + 'px';
      zbox.style.width = r.w + 'px'; zbox.style.height = r.h + 'px';
      zcan.style.width = r.w + 'px';
    };
    const afterLoad = () => {
      place(); reset();
      window.__zcnt = () => { nl.querySelector('.ar-zcnt').textContent = pad(cur+1) + ' / ' + list.length; nr.querySelector('.ar-zcnt').textContent = pad(cur+1) + ' / ' + list.length; };
      window.__zcnt();
      [1,-1].forEach(k => { const im = new Image(); im.src = list[(cur + k + list.length) % list.length].src; });
      if (!RM){
        const t = 'translate(' + srcRect.left + 'px,' + srcRect.top + 'px) scale(' + (srcRect.width / stageRect().w) + ',' + (srcRect.height / stageRect().h) + ')';
        zbox.animate([{transform:t},{transform:'none'}], {duration:560, easing:EASE, fill:'backwards'});
        zbg.animate([{opacity:0},{opacity:1}], {duration:336, easing:'ease-out', fill:'backwards'});
      }
      setTimeout(() => { opening = false; }, RM ? 0 : 560);
      ov.addEventListener('click', e => { if (e.target.closest('.ar-zbox, .ar-znav')) return; close(); });
      zbox.addEventListener('pointerdown', e => {
        if (opening) return;
        drag = {on:true, lx:e.clientX, ly:e.clientY, vx:0, vy:0, movedAt:-1e9, t:performance.now()};
        cancelAnimationFrame(raf); zbox.classList.add('dt-grab'); zbox.setPointerCapture(e.pointerId);
      });
      addEventListener('pointermove', e => {
        if (!drag || !drag.on) return;
        const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly, now = performance.now(), dt = Math.max(1, now - drag.t);
        if (Math.abs(dx) + Math.abs(dy) >= 2) drag.movedAt = now;
        drag.vx = dx / dt; drag.vy = dy / dt;
        T.ox += dx; T.oy += dy; drag.lx = e.clientX; drag.ly = e.clientY; drag.t = now;
        clampPan(); apply();
      });
      addEventListener('pointerup', () => {
        if (!drag || !drag.on) return; drag.on = false; zbox.classList.remove('dt-grab');
        if (performance.now() - drag.movedAt > 140) raf = requestAnimationFrame(inertia);
      });
      zbox.addEventListener('click', e => {
        if (opening || performance.now() - drag.movedAt < 240) return;
        if (T.z >= T.max - .001) return;
        zoomAt(e.clientX, e.clientY, 1.6);
      });
      addEventListener('wheel', wheelBlock, {passive:false, capture:true});
      document.addEventListener('wheel', wheelBlock, {passive:false, capture:true});
      document.addEventListener('keydown', onKey);
    };
    if (zimg.complete && zimg.naturalWidth) afterLoad();
    else { zimg.onload = afterLoad; zimg.onerror = afterLoad; }
  }

  imgs.forEach((im, i) => {
    im.closest('.ar-cell') && (im.closest('.ar-cell').style.cursor = 'zoom-in');
    im.addEventListener('click', () => open(i, im));
  });
  /* 详情页长图：点整列（含图片上下空白处）都能放大 */
  const detImg = imgs.find(im => im.alt === '详情页');
  if (detImg) {
    const cell = detImg.closest('.ar-cell');
    cell.addEventListener('click', e => { if (e.target === detImg) return; open(imgs.indexOf(detImg), detImg); });
  }
})();
